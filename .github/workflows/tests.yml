name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Sync dev dependencies
        run: |
          uv python install ${{ matrix.python }}
          uv sync --dev
      - name: Run offline tests
        run: |
          uv run pytest tests/ -q --cov=hyperliquid_mcp --tb=short > pytest_output.txt 2>&1 || FAILED=1
          grep -E "^(FAILED|ERROR)|Error|error" pytest_output.txt | head -25 | while IFS= read -r line; do
            echo "::error::${line:0:250}"
          done
          tail -40 pytest_output.txt
          exit ${FAILED:-0}
